<title>OshiMemo SVG Icons</title>
<style>
:root{--accent:#E4C1B5;--base:#EAE6E1;--text:#544C40;}
*{box-sizing:border-box}
body{margin:0;background:#faf8f6;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:1180px;margin:auto;padding:40px 24px}
h1{font-size:30px;margin:0 0 8px}
p{margin:0 0 28px;color:#7b6c61}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.card{margin:0;padding:18px;background:white;border:1px solid #eadfd8;border-radius:18px;text-align:center;box-shadow:0 5px 18px rgba(84,76,64,.06)}
.card img{width:64px;height:64px;display:block;margin:0 auto 12px}
figcaption{font-size:14px;margin-bottom:6px}
code{font-size:11px;color:#987e6d;word-break:break-all}
</style>
</head>
